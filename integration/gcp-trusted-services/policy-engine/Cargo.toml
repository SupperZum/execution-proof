[package]
name = "onb17-gcp-policy-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../../../../trustee-launch-dev/deps/policy-engine/src/lib.rs"

[features]
default = []
evaluation-capture = []

[dependencies]
key-value-storage = { path = "../../../../trustee-launch-dev/deps/key-value-storage", default-features = false }
anyhow = "=1.0.103"
async-trait = "=0.1.89"
base64 = "=0.22.1"
hex = "=0.4.3"
regorus = { version = "=0.10.1", default-features = false, features = ["regex", "base64", "time", "std"] }
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.11.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "=0.1.44"

[dev-dependencies]
rstest = "=0.26.1"
