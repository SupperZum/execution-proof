[package]
name = "onb17-manual-pack-assembler"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "=0.22.1"
execution-proof-client = { path = "../../../../client" }
execution-proof-contract = { path = "../../../../contract" }
execution-proof-handoff = { path = "../../../../handoff", features = ["rootfs-custody"] }
execution-proof-issuer = { path = "../../../../issuer", features = ["gcp"] }
execution-proof-verifier = { path = "../../../../verifier" }
libc = "0.2"
ring = "=0.17.14"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "3.27"
