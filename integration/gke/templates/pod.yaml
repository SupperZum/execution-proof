apiVersion: v1
kind: Pod
metadata:
  name: proof-1
  namespace: execution-proof
  annotations:
    # containerd 2.2.7 uses this when kubelet omits the CRI image runtime handler.
    io.containerd.cri.runtime-handler: kata-remote
spec:
  runtimeClassName: kata-remote
  schedulingGates:
    - name: execution-proof/attempt-bound
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  nodeSelector:
    kubernetes.io/arch: amd64
  containers:
    - name: workload
      image: registry.example.invalid/workloads/proof@sha256:27c0bda6a8b28891c8c45e0ddf9793f5bef4b2ce1aad6f6314447e346a243fc7
      imagePullPolicy: Always
      command: ["/app"]
      workingDir: /
      env:
        - name: HOME
          value: /
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
