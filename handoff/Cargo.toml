[package]
name = "execution-proof-handoff"
description = "One-use guest admission and boot-local launch bookkeeping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = []
software-lab = []
rootfs-transfer = ["dep:libc"]

[[test]]
name = "admission_lifecycle"
required-features = ["software-lab"]

[[test]]
name = "rootfs_transfer_process"
path = "tests/rootfs_transfer_process.rs"
harness = false
required-features = ["rootfs-transfer"]

[dependencies]
execution-proof-contract = { path = "../contract" }
libc = { workspace = true, optional = true }
ring.workspace = true

[dev-dependencies]
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
